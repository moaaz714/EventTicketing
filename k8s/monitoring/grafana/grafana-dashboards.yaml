apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  user-dashboard.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["user-service", "eventticketing"],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "User Service Dashboard",
      "uid": "user-service-dashboard",
      "version": 1,
      "panels": [
        {
          "id": 1,
          "title": "Error Rate (errors per minute)",
          "description": "Count of ERROR-level log lines from user-service per minute. Spike detection — sudden increases indicate registration or authentication failures.",
          "type": "timeseries",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "red" },
              "custom": { "lineWidth": 1, "fillOpacity": 10 },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": { "calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "single", "sort": "none" }
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "sum(count_over_time({app=\"eventticketing\", service=\"user-service\", level=\"ERROR\"}[1m]))",
              "legendFormat": "errors/min",
              "queryType": "range",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "RabbitMQ Event Audit (user.registered / user.deactivated)",
          "description": "Log lines emitted by user-service event publishers and consumers, filtered by routing key.",
          "type": "logs",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": false,
            "showCommonLabels": false,
            "showLabels": false,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": false
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "{app=\"eventticketing\", service=\"user-service\"} |~ \"routingKey|user\\.registered|user\\.deactivated\"",
              "queryType": "range",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Feign Call Outcomes",
          "description": "Log lines for successful Feign responses and FeignException catches from user-service. Detects when downstream services are degraded.",
          "type": "logs",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": false,
            "showCommonLabels": false,
            "showLabels": false,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": false
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "{app=\"eventticketing\", service=\"user-service\"} |~ \"Feign|FeignException\"",
              "queryType": "range",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "HTTP Request Rate (req/s per endpoint)",
          "description": "Requests per second to user-service endpoints, grouped by method and URI.",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 1, "fillOpacity": 10 },
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by(method, uri) (rate(http_server_requests_seconds_count{job=\"user-service\"}[5m]))",
              "legendFormat": "{{method}} {{uri}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "title": "HTTP Latency Percentiles (P50 / P95 / P99)",
          "description": "Request latency percentiles for user-service endpoints.",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 1, "fillOpacity": 10 },
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.50, sum by(le, uri) (rate(http_server_requests_seconds_bucket{job=\"user-service\"}[5m])))",
              "legendFormat": "P50 {{uri}}",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.95, sum by(le, uri) (rate(http_server_requests_seconds_bucket{job=\"user-service\"}[5m])))",
              "legendFormat": "P95 {{uri}}",
              "refId": "B"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.99, sum by(le, uri) (rate(http_server_requests_seconds_bucket{job=\"user-service\"}[5m])))",
              "legendFormat": "P99 {{uri}}",
              "refId": "C"
            }
          ]
        },
        {
          "id": 6,
          "title": "JVM Heap Usage",
          "description": "JVM heap memory used by user-service. Alerts on memory pressure before OOM.",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 1, "fillOpacity": 10 },
              "unit": "bytes"
            },
            "overrides": []
          },
          "options": {
            "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "jvm_memory_used_bytes{job=\"user-service\", area=\"heap\"}",
              "legendFormat": "heap used",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "jvm_memory_max_bytes{job=\"user-service\", area=\"heap\"}",
              "legendFormat": "heap max",
              "refId": "B"
            }
          ]
        }
      ]
    }
  event-dashboard.json: |
    {}
  booking-dashboard.json: |
    {}
  ticket-dashboard.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "description": "Ticket Service Dashboard — S4-Events PromQL + LogQL panels",
      "refresh": "30s",
      "schemaVersion": 38,
      "tags": ["eventticketing", "ticket-service", "S4-Events", "promql", "logql"],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "timezone": "browser",
      "title": "Ticket Service Dashboard",
      "uid": "ticket-service-dashboard",
      "version": 1,
      "panels": [
        {
          "id": 1,
          "title": "Ticket Service — HTTP Request Rate by URI",
          "description": "Requests per second per endpoint. Which ticket-service endpoints are under load.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (uri) (rate(http_server_requests_seconds_count{service=\"ticket-service\"}[5m]))",
              "legendFormat": "{{uri}}",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "lineWidth": 2, "fillOpacity": 10 }, "unit": "reqps" } }
        },
        {
          "id": 2,
          "title": "Ticket Service — HTTP P99 Latency by URI",
          "description": "P99 request latency per endpoint. Detect slow paths — e.g. S4-F3 nearby two-stage Feign chain.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum by (le, uri) (rate(http_server_requests_seconds_bucket{service=\"ticket-service\"}[5m])))",
              "legendFormat": "{{uri}}",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "lineWidth": 2, "fillOpacity": 10 }, "unit": "s" } }
        },
        {
          "id": 3,
          "title": "Ticket Service — RabbitMQ Publish Throughput (S4 publishes)",
          "description": "Outgoing AMQP messages per second to ticket.events exchange (ticket.issued / ticket.status-changed / ticket.cancelled).",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (exchange) (rate(spring_rabbitmq_published_total{service=\"ticket-service\"}[5m]))",
              "legendFormat": "{{exchange}}",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "lineWidth": 2, "fillOpacity": 10 }, "unit": "ops" } }
        },
        {
          "id": 4,
          "title": "Ticket Service — RabbitMQ Consumer Activity (S4 consumes)",
          "description": "Listener invocations on ticket.event-listener (event.status-changed) and ticket.booking-listener (booking.placed/completed/cancelled cascades).",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (queue) (rate(spring_rabbitmq_listener_seconds_count{service=\"ticket-service\"}[5m]))",
              "legendFormat": "{{queue}}",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "lineWidth": 2, "fillOpacity": 10 }, "unit": "ops" } }
        },
        {
          "id": 5,
          "title": "Ticket Service — JVM Heap Used",
          "description": "Heap memory in use. Memory pressure under batch issuance or cancellation cascade.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(jvm_memory_used_bytes{service=\"ticket-service\", area=\"heap\"})",
              "legendFormat": "heap used",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "lineWidth": 2, "fillOpacity": 10 }, "unit": "bytes" } }
        },
        {
          "id": 6,
          "title": "Ticket Service — Cascade Cancellation Audit (LogQL)",
          "description": "Audit log lines for cascading ticket cancellations from booking.cancelled and event.status-changed -> CANCELLED.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            {
              "expr": "sum(count_over_time({app=\"eventticketing\", service=\"ticket-service\"} |~ \"Cancelled .* ticket\\\\(s\\\\) cascading\" [5m]))",
              "legendFormat": "cascade cancellations",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "lineWidth": 2, "fillOpacity": 10 }, "unit": "short" } }
        }
      ]
    }
  sales-dashboard.json: |
    {}