services:
  postgres:
    image: postgres:15-alpine
    container_name: eventticketing-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=eventticketingdb
    volumes:
      - pgdata:/var/lib/postgresql/data

    restart: always


volumes:
  pgdata: