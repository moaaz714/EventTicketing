name: CI

on:
  push:
    branches:
      - "main"
      - "feat/**"
  pull_request:
    branches:
      - "main"

jobs:
  build:
    name: Maven build + unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Install contracts (required by service modules)
        run: mvn -B -pl contracts -am install -DskipTests

      - name: Build & test
        run: mvn clean package -DskipTests

  docker:
    name: Docker build (main only)
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repo owner
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build & push ticket-service image
        uses: docker/build-push-action@v6
        with:
          context: ./ticket-service
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/ticket-service:latest
            ghcr.io/${{ env.OWNER_LC }}/ticket-service:${{ github.sha }}
