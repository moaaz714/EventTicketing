name: CI

on:
  push:
    branches:
      - 'main'
      - 'feat/**'
  pull_request:
    branches:
      - 'main'

jobs:
  build:
    name: Maven build + unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install contracts (required by service modules)
        run: mvn -B -pl contracts -am install -DskipTests

      - name: Build & test ticket-service
        run: mvn -B -pl ticket-service -am package

  docker:
    name: Docker build (main only)
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ticket-service image
        uses: docker/build-push-action@v6
        with:
          context: ./ticket-service
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ticket-service:latest
            ghcr.io/${{ github.repository_owner }}/ticket-service:${{ github.sha }}
